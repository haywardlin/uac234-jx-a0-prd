<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1410" viewBox="0 0 1800 1410" role="img" aria-label="两条升级链路：固件 OTA 与 WAV 音频更新"><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9" fill="none" stroke="#7c8798" stroke-width="1.3"/></marker></defs><g font-family="PingFang SC,Microsoft YaHei,Noto Sans CJK SC,sans-serif"><rect width="1800" height="1410" fill="#fffdee"/><text x="900.0" y="56" font-size="34" text-anchor="middle" fill="#23334c" font-weight="600">两条升级链路：固件 OTA 与 WAV 音频更新</text><text x="900.0" y="94" font-size="18" text-anchor="middle" fill="#5d6979" font-weight="400">升级文件接收成功、文件生效和设备重启安装，是不同阶段。</text><line x1="42" y1="116" x2="1758" y2="116" stroke="#dad8c6"/><rect x="40" y="140" width="820" height="1115" rx="18" fill="#ffffff" fill-opacity=".52" stroke="#ddd9c5"/><text x="60" y="174" font-size="24" text-anchor="start" fill="#23334c" font-weight="600">固件 OTA</text><rect x="90" y="205" width="720" height="110" rx="15" fill="#eaf0ff" stroke="#6f91d4" stroke-width="2"/><text x="110" y="239" font-size="24" text-anchor="start" fill="#23334c" font-weight="600">App 查询版本并请求 OTA</text><text x="110" y="274.0" font-size="22" text-anchor="start" fill="#23334c" font-weight="400">设备检查鉴权与电量；仅接受更高固件版本。</text><path d="M450,315 L450,355" fill="none" stroke="#7c8798" stroke-width="2.5" stroke-linejoin="round"  marker-end="url(#arrow)"/><path d="M450.0,355 L630,417.5 L450.0,480 L270,417.5 Z" fill="#fff0d7" stroke="#e3a14e" stroke-width="2"/><text x="450.0" y="423.8" font-size="21" text-anchor="middle" fill="#23334c" font-weight="600">设备允许升级？</text><rect x="90" y="525" width="720" height="105" rx="15" fill="#fff5f2" stroke="#d99b8c" stroke-width="2"/><text x="110" y="559" font-size="23" text-anchor="start" fill="#ad3636" font-weight="600">拒绝时</text><text x="110" y="594.0" font-size="21" text-anchor="start" fill="#ad3636" font-weight="400">返回原因，不开始传输；设备文档门槛 ≥20%，BLE 协议 ≥25%，二者</text><text x="110" y="623.4" font-size="21" text-anchor="start" fill="#ad3636" font-weight="400">待统一。</text><path d="M270,418 L65,418 L65,575 L90,575" fill="none" stroke="#7c8798" stroke-width="2.5" stroke-linejoin="round"  marker-end="url(#arrow)"/><rect x="103.0" y="381" width="34" height="27" fill="#fffdee"/><text x="120" y="402" font-size="20" text-anchor="middle" fill="#7c8798" font-weight="400">否</text><path d="M450,480 L850,480 L850,690 L810,690" fill="none" stroke="#7c8798" stroke-width="2.5" stroke-linejoin="round"  marker-end="url(#arrow)"/><rect x="773.0" y="448" width="34" height="27" fill="#fffdee"/><text x="790" y="469" font-size="20" text-anchor="middle" fill="#7c8798" font-weight="400">是</text><rect x="90" y="660" width="720" height="125" rx="15" fill="#eaf0ff" stroke="#6f91d4" stroke-width="2"/><text x="110" y="694" font-size="24" text-anchor="start" fill="#23334c" font-weight="600">发送文件信息 → 分包数据</text><text x="110" y="729.0" font-size="22" text-anchor="start" fill="#23334c" font-weight="400">包含版本、长度与 CRC32；单包有效数据 ≤480 B。</text><text x="110" y="759.8" font-size="22" text-anchor="start" fill="#23334c" font-weight="400">传输过程中 8 秒无数据：中止。</text><path d="M450,785 L450,830" fill="none" stroke="#7c8798" stroke-width="2.5" stroke-linejoin="round"  marker-end="url(#arrow)"/><rect x="90" y="830" width="720" height="110" rx="15" fill="#eaf0ff" stroke="#6f91d4" stroke-width="2"/><text x="110" y="864" font-size="24" text-anchor="start" fill="#23334c" font-weight="600">发送结束命令，校验与应答</text><text x="110" y="899.0" font-size="22" text-anchor="start" fill="#23334c" font-weight="400">按设备返回状态区分成功 / 错误。</text><path d="M450,940 L450,985" fill="none" stroke="#7c8798" stroke-width="2.5" stroke-linejoin="round"  marker-end="url(#arrow)"/><rect x="463.0" y="949" width="54" height="27" fill="#fffdee"/><text x="490" y="970" font-size="20" text-anchor="middle" fill="#7c8798" font-weight="400">成功</text><rect x="90" y="985" width="720" height="110" rx="15" fill="#eaf0ff" stroke="#6f91d4" stroke-width="2"/><text x="110" y="1019" font-size="24" text-anchor="start" fill="#23334c" font-weight="600">设备随后重启安装新固件</text><text x="110" y="1054.0" font-size="22" text-anchor="start" fill="#23334c" font-weight="400">结束命令成功不等于安装过程已经完成。</text><rect x="90" y="1135" width="720" height="90" rx="12" fill="#fffef7" stroke="#d5cdb3"/><text x="108" y="1166" font-size="21" text-anchor="start" fill="#23334c" font-weight="600">资料范围</text><text x="206" y="1166.0" font-size="19" text-anchor="start" fill="#23334c" font-weight="400">未规定安装完成的 App 提示、重连验版策略或失败回滚方式；本</text><text x="206" y="1191.65" font-size="19" text-anchor="start" fill="#23334c" font-weight="400">图不补写。</text><rect x="900" y="140" width="860" height="1115" rx="18" fill="#ffffff" fill-opacity=".52" stroke="#ddd9c5"/><text x="920" y="174" font-size="24" text-anchor="start" fill="#23334c" font-weight="600">WAV 全量更新</text><rect x="950" y="205" width="760" height="110" rx="15" fill="#eaf0ff" stroke="#6f91d4" stroke-width="2"/><text x="970" y="239" font-size="24" text-anchor="start" fill="#23334c" font-weight="600">开始更新（0x52）</text><text x="970" y="274.0" font-size="22" text-anchor="start" fill="#23334c" font-weight="400">仅支持全量；列出更新后设备应保留的全部 WAV。</text><path d="M1330,315 L1330,350" fill="none" stroke="#7c8798" stroke-width="2.5" stroke-linejoin="round"  marker-end="url(#arrow)"/><rect x="950" y="350" width="760" height="110" rx="15" fill="#eaf0ff" stroke="#6f91d4" stroke-width="2"/><text x="970" y="384" font-size="24" text-anchor="start" fill="#23334c" font-weight="600">依次发送文件信息（0x53）</text><text x="970" y="419.0" font-size="22" text-anchor="start" fill="#23334c" font-weight="400">按文件编号递增；上一文件结束后再发下一文件。</text><path d="M1330,460 L1330,500" fill="none" stroke="#7c8798" stroke-width="2.5" stroke-linejoin="round"  marker-end="url(#arrow)"/><path d="M1330.0,500 L1510,562.5 L1330.0,625 L1150,562.5 Z" fill="#fff0d7" stroke="#e3a14e" stroke-width="2"/><text x="1330.0" y="554.0999999999999" font-size="21" text-anchor="middle" fill="#23334c" font-weight="600">名称 / 长度 / CRC</text><text x="1330.0" y="583.4999999999999" font-size="21" text-anchor="middle" fill="#23334c" font-weight="600">与设备一致？</text><rect x="950" y="680" width="360" height="115" rx="15" fill="#eaf0ff" stroke="#6f91d4" stroke-width="2"/><text x="970" y="714" font-size="22" text-anchor="start" fill="#23334c" font-weight="600">不一致：传数据</text><text x="970" y="749.0" font-size="20" text-anchor="start" fill="#23334c" font-weight="400">0x54；每包 1～480 B。</text><rect x="1380" y="680" width="330" height="115" rx="15" fill="#eaf0ff" stroke="#6f91d4" stroke-width="2"/><text x="1400" y="714" font-size="22" text-anchor="start" fill="#23334c" font-weight="600">一致：跳过数据</text><text x="1400" y="749.0" font-size="20" text-anchor="start" fill="#23334c" font-weight="400">仍计入本次完整清单。</text><path d="M1230,597 L1130,597 L1130,680" fill="none" stroke="#7c8798" stroke-width="2.5" stroke-linejoin="round"  marker-end="url(#arrow)"/><rect x="1103.0" y="625" width="34" height="27" fill="#fffdee"/><text x="1120" y="646" font-size="20" text-anchor="middle" fill="#7c8798" font-weight="400">否</text><path d="M1430,597 L1545,597 L1545,680" fill="none" stroke="#7c8798" stroke-width="2.5" stroke-linejoin="round"  marker-end="url(#arrow)"/><rect x="1528.0" y="625" width="34" height="27" fill="#fffdee"/><text x="1545" y="646" font-size="20" text-anchor="middle" fill="#7c8798" font-weight="400">是</text><path d="M1130,795 L1130,840 L1330,840 L1330,880" fill="none" stroke="#7c8798" stroke-width="2.5" stroke-linejoin="round"  marker-end="url(#arrow)"/><path d="M1545,795 L1545,840 L1330,840" fill="none" stroke="#7c8798" stroke-width="2.5" stroke-linejoin="round"  marker-end="url(#arrow)"/><rect x="950" y="880" width="760" height="110" rx="15" fill="#eaf0ff" stroke="#6f91d4" stroke-width="2"/><text x="970" y="914" font-size="24" text-anchor="start" fill="#23334c" font-weight="600">全部文件完成 → 提交（0x55）</text><text x="970" y="949.0" font-size="22" text-anchor="start" fill="#23334c" font-weight="400">成功：更新文件、删除清单外 WAV、保存资源版本。</text><rect x="950" y="1030" width="760" height="195" rx="15" fill="#fffef7" stroke="#d5cdb3" stroke-width="2"/><text x="970" y="1064" font-size="22" text-anchor="start" fill="#23334c" font-weight="600">会话约束与异常</text><text x="970" y="1099.0" font-size="20" text-anchor="start" fill="#23334c" font-weight="400">期间禁止播放；失败 / 断连 / 8 秒无会话命令则结束。</text><text x="970" y="1127.0" font-size="20" text-anchor="start" fill="#23334c" font-weight="400">0x52～0x54 应答超时 3 秒；0x55 超时 10 秒。</text><text x="970" y="1155.0" font-size="20" text-anchor="start" fill="#23334c" font-weight="400">同帧最多重发 3 次；提交期间不计 8 秒空闲超时。</text><text x="970" y="1183.0" font-size="20" text-anchor="start" fill="#23334c" font-weight="400">资源版本可相同或更低；文件大小 / 数量上限待补。</text><rect x="40" y="1280" width="1720" height="65" rx="12" fill="#fff5f2" stroke="#d99b8c"/><text x="58" y="1311" font-size="21" text-anchor="start" fill="#ad3636" font-weight="600">结果边界</text><text x="156" y="1311.0" font-size="19" text-anchor="start" fill="#ad3636" font-weight="400">WAV 只有 0x55 成功才生效；若提交应答丢失，仅凭 App 超时不能断言设备仍为旧版本。</text><text x="44" y="1353" font-size="16.5" text-anchor="start" fill="#5d6979" font-weight="400">依据：设备功能说明 §4.3；BLE协议 §§5.14—5.18、WAV总体说明及5.32—5.35。</text></g></svg>