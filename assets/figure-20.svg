<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1370" viewBox="0 0 1800 1370" role="img" aria-label="输入识别：触摸、光感、IMU 与唤醒词"><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9" fill="none" stroke="#7c8798" stroke-width="1.3"/></marker></defs><g font-family="PingFang SC,Microsoft YaHei,Noto Sans CJK SC,sans-serif"><rect width="1800" height="1370" fill="#fffdee"/><text x="900.0" y="56" font-size="34" text-anchor="middle" fill="#23334c" font-weight="600">输入识别：触摸、光感、IMU 与唤醒词</text><text x="900.0" y="94" font-size="18" text-anchor="middle" fill="#5d6979" font-weight="400">识别出事件后，还要经过运行状态、行为拦截和播放优先级判断。</text><line x1="42" y1="116" x2="1758" y2="116" stroke="#dad8c6"/><rect x="40" y="140" width="550" height="1050" rx="18" fill="#ffffff" fill-opacity=".52" stroke="#ddd9c5"/><text x="60" y="174" font-size="24" text-anchor="start" fill="#23334c" font-weight="600">触摸输入</text><rect x="70" y="200" width="490" height="150" rx="15" fill="#eaf0ff" stroke="#6f91d4" stroke-width="2"/><text x="90" y="234" font-size="24" text-anchor="start" fill="#23334c" font-weight="600">3 组 / 7 个触摸区域</text><text x="90" y="269.0" font-size="22" text-anchor="start" fill="#23334c" font-weight="400">头顶、头左、头右；后背、身体左、身体右；</text><text x="90" y="299.8" font-size="22" text-anchor="start" fill="#23334c" font-weight="400">肚子。</text><text x="90" y="330.6" font-size="22" text-anchor="start" fill="#23334c" font-weight="400">前三种手势：7 × 3 = 21 个事件。</text><path d="M315,350 L315,390" fill="none" stroke="#7c8798" stroke-width="2.5" stroke-linejoin="round"  marker-end="url(#arrow)"/><rect x="70" y="390" width="490" height="210" rx="15" fill="#eaf0ff" stroke="#6f91d4" stroke-width="2"/><text x="90" y="424" font-size="24" text-anchor="start" fill="#23334c" font-weight="600">按持续时间识别</text><text x="90" y="459.0" font-size="22" text-anchor="start" fill="#23334c" font-weight="400">&lt; 1 秒松开：碰一碰；</text><text x="90" y="489.8" font-size="22" text-anchor="start" fill="#23334c" font-weight="400">满 1 秒、&lt; 3 秒松开：撸一撸；</text><text x="90" y="520.6" font-size="22" text-anchor="start" fill="#23334c" font-weight="400">满 3 秒：立即触发长时间抚摸，</text><text x="90" y="551.4" font-size="22" text-anchor="start" fill="#23334c" font-weight="400">此后松手不再触发。</text><path d="M315,600 L315,645" fill="none" stroke="#7c8798" stroke-width="2.5" stroke-linejoin="round"  marker-end="url(#arrow)"/><rect x="70" y="645" width="490" height="150" rx="15" fill="#eaf0ff" stroke="#6f91d4" stroke-width="2"/><text x="90" y="679" font-size="24" text-anchor="start" fill="#23334c" font-weight="600">长时间握持</text><text x="90" y="714.0" font-size="22" text-anchor="start" fill="#23334c" font-weight="400">原文：“肚子 + 背部任意两个区域”。</text><text x="90" y="744.8" font-size="22" text-anchor="start" fill="#23334c" font-weight="400">同时按住满 5 秒，松手触发。</text><rect x="70" y="840" width="490" height="175" rx="15" fill="#eaf0ff" stroke="#6f91d4" stroke-width="2"/><text x="90" y="874" font-size="24" text-anchor="start" fill="#23334c" font-weight="600">多输入同时满足时</text><text x="90" y="909.0" font-size="22" text-anchor="start" fill="#23334c" font-weight="400">手势：握持 &gt; 长抚摸 &gt; 撸 &gt; 碰。</text><text x="90" y="939.8" font-size="22" text-anchor="start" fill="#23334c" font-weight="400">区域：头顶 &gt; 肚子 &gt; 头左 / 头右</text><text x="90" y="970.6" font-size="22" text-anchor="start" fill="#23334c" font-weight="400">&gt; 后背 &gt; 身体两侧。</text><rect x="70" y="1045" width="490" height="120" rx="15" fill="#fff5f2" stroke="#d99b8c" stroke-width="2"/><text x="90" y="1079" font-size="21" text-anchor="start" fill="#ad3636" font-weight="600">需确认</text><text x="90" y="1114.0" font-size="19" text-anchor="start" fill="#ad3636" font-weight="400">握持参与区域的数量含义；与 3 秒长抚摸如何衔接。</text><text x="90" y="1140.6" font-size="19" text-anchor="start" fill="#ad3636" font-weight="400">动作表的部分长按门槛与设备文档不同。</text><rect x="625" y="140" width="550" height="1050" rx="18" fill="#ffffff" fill-opacity=".52" stroke="#ddd9c5"/><text x="645" y="174" font-size="24" text-anchor="start" fill="#23334c" font-weight="600">光感输入</text><rect x="655" y="200" width="490" height="105" rx="15" fill="#eaf0ff" stroke="#6f91d4" stroke-width="2"/><text x="675" y="234" font-size="23" text-anchor="start" fill="#23334c" font-weight="600">光感可触发事件</text><text x="675" y="269.0" font-size="21" text-anchor="start" fill="#23334c" font-weight="400">开机 / 退出深待机后约 8 秒内不触发。</text><path d="M900,305 L900,350" fill="none" stroke="#7c8798" stroke-width="2.5" stroke-linejoin="round"  marker-end="url(#arrow)"/><path d="M900.0,350 L1075,415.0 L900.0,480 L725,415.0 Z" fill="#fff0d7" stroke="#e3a14e" stroke-width="2"/><text x="900.0" y="406.6" font-size="21" text-anchor="middle" fill="#23334c" font-weight="600">原始值 &lt; 10</text><text x="900.0" y="436.0" font-size="21" text-anchor="middle" fill="#23334c" font-weight="600">持续约 2.5 秒？</text><rect x="655" y="530" width="490" height="120" rx="15" fill="#eaf0ff" stroke="#6f91d4" stroke-width="2"/><text x="675" y="564" font-size="23" text-anchor="start" fill="#23334c" font-weight="600">变暗事件 → 暗状态</text><text x="675" y="599.0" font-size="21" text-anchor="start" fill="#23334c" font-weight="400">暗状态拦截其他互动；“变暗”本身例外。</text><path d="M900,480 L900,530" fill="none" stroke="#7c8798" stroke-width="2.5" stroke-linejoin="round"  marker-end="url(#arrow)"/><rect x="913.0" y="494" width="34" height="27" fill="#fffdee"/><text x="930" y="515" font-size="20" text-anchor="middle" fill="#7c8798" font-weight="400">是</text><rect x="655" y="710" width="490" height="110" rx="15" fill="#eaf0ff" stroke="#6f91d4" stroke-width="2"/><text x="675" y="744" font-size="23" text-anchor="start" fill="#23334c" font-weight="600">原始值 &gt; 950 → 解除暗状态</text><text x="675" y="779.0" font-size="21" text-anchor="start" fill="#23334c" font-weight="400">解除本身不产生事件。</text><path d="M900,650 L900,710" fill="none" stroke="#7c8798" stroke-width="2.5" stroke-linejoin="round"  marker-end="url(#arrow)"/><rect x="655" y="870" width="490" height="145" rx="15" fill="#eaf0ff" stroke="#6f91d4" stroke-width="2"/><text x="675" y="904" font-size="23" text-anchor="start" fill="#23334c" font-weight="600">正常状态：原始值 &gt; 1000</text><text x="675" y="939.0" font-size="21" text-anchor="start" fill="#23334c" font-weight="400">持续约 2.5 秒 → 变亮事件。</text><text x="675" y="968.4" font-size="21" text-anchor="start" fill="#23334c" font-weight="400">回落到“60 以下”后才能再次触发。</text><rect x="655" y="1045" width="490" height="120" rx="15" fill="#fff5f2" stroke="#d99b8c" stroke-width="2"/><text x="675" y="1079" font-size="21" text-anchor="start" fill="#ad3636" font-weight="600">需确认</text><text x="675" y="1114.0" font-size="19" text-anchor="start" fill="#ad3636" font-weight="400">原始值并非照度 lux；恰好 60 的边界未说明。</text><text x="675" y="1140.6" font-size="19" text-anchor="start" fill="#ad3636" font-weight="400">暗状态直接升到 &gt;1000 的事件顺序未写明。</text><rect x="1210" y="140" width="550" height="1050" rx="18" fill="#ffffff" fill-opacity=".52" stroke="#ddd9c5"/><text x="1230" y="174" font-size="24" text-anchor="start" fill="#23334c" font-weight="600">IMU / 语音输入</text><rect x="1240" y="200" width="490" height="120" rx="15" fill="#eaf0ff" stroke="#6f91d4" stroke-width="2"/><text x="1260" y="234" font-size="23" text-anchor="start" fill="#23334c" font-weight="600">IMU 采样周期 10 ms</text><text x="1260" y="269.0" font-size="21" text-anchor="start" fill="#23334c" font-weight="400">Idle → Active（最长约 2.5 秒）</text><text x="1260" y="298.4" font-size="21" text-anchor="start" fill="#23334c" font-weight="400">→ Parse → Cooldown 200 ms → Idle。</text><path d="M1485,320 L1485,365" fill="none" stroke="#7c8798" stroke-width="2.5" stroke-linejoin="round"  marker-end="url(#arrow)"/><rect x="1240" y="365" width="490" height="175" rx="15" fill="#eaf0ff" stroke="#6f91d4" stroke-width="2"/><text x="1260" y="399" font-size="23" text-anchor="start" fill="#23334c" font-weight="600">同一手势段只报一个事件</text><text x="1260" y="434.0" font-size="21" text-anchor="start" fill="#23334c" font-weight="400">优先级：旋转上抛 &gt; 上抛 &gt; 猛摇</text><text x="1260" y="463.4" font-size="21" text-anchor="start" fill="#23334c" font-weight="400">&gt; 翻转 &gt; 倾倒 &gt; 轻摇。</text><text x="1260" y="492.8" font-size="21" text-anchor="start" fill="#23334c" font-weight="400">未命中上述事件：没有随机事件兜底。</text><rect x="1240" y="590" width="490" height="175" rx="15" fill="#eaf0ff" stroke="#6f91d4" stroke-width="2"/><text x="1260" y="624" font-size="23" text-anchor="start" fill="#23334c" font-weight="600">拿起 / 放下：独立互锁</text><text x="1260" y="659.0" font-size="21" text-anchor="start" fill="#23334c" font-weight="400">只有桌上能报拿起；只有手上能报放下。</text><text x="1260" y="688.4" font-size="21" text-anchor="start" fill="#23334c" font-weight="400">拿起累计约 300 ms；放下稳定约 2 秒。</text><text x="1260" y="717.8" font-size="21" text-anchor="start" fill="#23334c" font-weight="400">其他姿态事件会打断放下确认。</text><rect x="1240" y="815" width="490" height="160" rx="15" fill="#eaf0ff" stroke="#6f91d4" stroke-width="2"/><text x="1260" y="849" font-size="23" text-anchor="start" fill="#23334c" font-weight="600">离线唤醒词：Hello Beany</text><text x="1260" y="884.0" font-size="21" text-anchor="start" fill="#23334c" font-weight="400">浅睡 → 完全唤醒 + 唤醒反应。</text><text x="1260" y="913.4" font-size="21" text-anchor="start" fill="#23334c" font-weight="400">深待机：语音识别断电，无效。</text><text x="1260" y="942.8" font-size="21" text-anchor="start" fill="#23334c" font-weight="400">暗 / 充电 / 静默 / 睡眠时段需按拦截规则。</text><rect x="1240" y="1015" width="490" height="150" rx="15" fill="#fff5f2" stroke="#d99b8c" stroke-width="2"/><text x="1260" y="1049" font-size="21" text-anchor="start" fill="#ad3636" font-weight="600">概念与范围</text><text x="1260" y="1084.0" font-size="19" text-anchor="start" fill="#ad3636" font-weight="400">IMU 的 Idle 是识别器空闲，不等于设备浅睡。</text><text x="1260" y="1110.6" font-size="19" text-anchor="start" fill="#ad3636" font-weight="400">拿起、放下、旋转上抛在动作表有删除线 / N；</text><text x="1260" y="1137.2" font-size="19" text-anchor="start" fill="#ad3636" font-weight="400">设备文档仍定义，需确认版本范围。</text><rect x="40" y="1210" width="1720" height="80" rx="12" fill="#fffef7" stroke="#d5cdb3"/><text x="58" y="1241" font-size="22" text-anchor="start" fill="#23334c" font-weight="600">边界提示</text><text x="160" y="1241.0" font-size="20" text-anchor="start" fill="#23334c" font-weight="400">本图整理原文的输入识别规则；完整 IMU 阈值与每个事件的动作 / 音频配对，请查主 PRD 的软件需求和交互矩阵。</text><text x="44" y="1313" font-size="16.5" text-anchor="start" fill="#5d6979" font-weight="400">依据：设备功能说明 §§6—8；八个IMU事件触发标准 总则、拿起、放下；动作统计表「输入事件」。</text></g></svg>