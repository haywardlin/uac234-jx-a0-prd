<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1230" viewBox="0 0 1800 1230" role="img" aria-label="充电、低电和温度保护"><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9" fill="none" stroke="#7c8798" stroke-width="1.3"/></marker></defs><g font-family="PingFang SC,Microsoft YaHei,Noto Sans CJK SC,sans-serif"><rect width="1800" height="1230" fill="#fffdee"/><text x="900.0" y="56" font-size="34" text-anchor="middle" fill="#23334c" font-weight="600">充电、低电和温度保护</text><text x="900.0" y="94" font-size="18" text-anchor="middle" fill="#5d6979" font-weight="400">温度保护只在充电时生效；图中的“以下”保留原文，边界待确认。</text><line x1="42" y1="116" x2="1758" y2="116" stroke="#dad8c6"/><rect x="40" y="140" width="820" height="920" rx="18" fill="#ffffff" fill-opacity=".52" stroke="#ddd9c5"/><text x="60" y="174" font-size="24" text-anchor="start" fill="#23334c" font-weight="600">插拔充电与低电</text><rect x="90" y="200" width="720" height="130" rx="15" fill="#eaf0ff" stroke="#6f91d4" stroke-width="2"/><text x="110" y="234" font-size="24" text-anchor="start" fill="#23334c" font-weight="600">关机时插入充电</text><text x="110" y="269.0" font-size="22" text-anchor="start" fill="#23334c" font-weight="400">只在后台充电，不开机。</text><text x="110" y="299.8" font-size="22" text-anchor="start" fill="#23334c" font-weight="400">拔出后继续关机。</text><rect x="90" y="390" width="720" height="150" rx="15" fill="#eaf0ff" stroke="#6f91d4" stroke-width="2"/><text x="110" y="424" font-size="24" text-anchor="start" fill="#23334c" font-weight="600">开机时插入充电</text><text x="110" y="459.0" font-size="22" text-anchor="start" fill="#23334c" font-weight="400">播放充电动作；5 秒后进入深待机。</text><text x="110" y="489.8" font-size="22" text-anchor="start" fill="#23334c" font-weight="400">若插入前已处于静音 / 睡眠时段：直接待机。</text><text x="110" y="520.6" font-size="22" text-anchor="start" fill="#23334c" font-weight="400">充满没有动作；通知无线充电座已充满。</text><path d="M450,540 L450,590" fill="none" stroke="#7c8798" stroke-width="2.5" stroke-linejoin="round"  marker-end="url(#arrow)"/><rect x="90" y="590" width="720" height="140" rx="15" fill="#eaf0ff" stroke="#6f91d4" stroke-width="2"/><text x="110" y="624" font-size="24" text-anchor="start" fill="#23334c" font-weight="600">拔掉充电</text><text x="110" y="659.0" font-size="22" text-anchor="start" fill="#23334c" font-weight="400">连续约 2 秒未检测到充电，才确认拔出。</text><text x="110" y="689.8" font-size="22" text-anchor="start" fill="#23334c" font-weight="400">拔出本身无动作；深待机全部条件解除才恢复。</text><rect x="90" y="775" width="720" height="240" rx="15" fill="#fff5f2" stroke="#d99b8c" stroke-width="2"/><text x="110" y="809" font-size="22" text-anchor="start" fill="#ad3636" font-weight="600">低电处理</text><text x="110" y="844.0" font-size="20" text-anchor="start" fill="#ad3636" font-weight="400">首次降到 20% / 10% / 0%：各播放一次低电动作。</text><text x="110" y="872.0" font-size="20" text-anchor="start" fill="#ad3636" font-weight="400">若处在浅睡，短暂唤醒播放。</text><text x="110" y="900.0" font-size="20" text-anchor="start" fill="#ad3636" font-weight="400">约每 30 秒检测电压，连续 3 次 &lt;3.40 V：静默关机。</text><text x="110" y="928.0" font-size="20" text-anchor="start" fill="#ad3636" font-weight="400">只有电压 &gt;3.45 V 才允许开机。</text><text x="110" y="956.0" font-size="20" text-anchor="start" fill="#ad3636" font-weight="400">资源表的低电项另有“删掉”文字，需核对范围。</text><rect x="900" y="140" width="860" height="920" rx="18" fill="#ffffff" fill-opacity=".52" stroke="#ddd9c5"/><text x="920" y="174" font-size="24" text-anchor="start" fill="#23334c" font-weight="600">充电期间温度保护</text><rect x="950" y="200" width="760" height="100" rx="15" fill="#eaf0ff" stroke="#6f91d4" stroke-width="2"/><text x="1330.0" y="258.0" font-size="25" text-anchor="middle" fill="#23334c" font-weight="600">充电中监测电池温度</text><path d="M1330,300 L1330,345" fill="none" stroke="#7c8798" stroke-width="2.5" stroke-linejoin="round"  marker-end="url(#arrow)"/><rect x="950" y="345" width="760" height="145" rx="15" fill="#eaf0ff" stroke="#6f91d4" stroke-width="2"/><text x="970" y="379" font-size="24" text-anchor="start" fill="#23334c" font-weight="600">温度 ≥46 ℃</text><text x="970" y="414.0" font-size="22" text-anchor="start" fill="#23334c" font-weight="400">降低充满电压；电压 ≥4.1 V 时停止充电。</text><text x="970" y="444.8" font-size="22" text-anchor="start" fill="#23334c" font-weight="400">电压降到“4.0 V 以下”时恢复。</text><path d="M1330,490 L1330,540" fill="none" stroke="#7c8798" stroke-width="2.5" stroke-linejoin="round"  marker-end="url(#arrow)"/><rect x="1353.0" y="502" width="174" height="27" fill="#fffdee"/><text x="1440" y="523" font-size="20" text-anchor="middle" fill="#7c8798" font-weight="400">达到更高温度阈值</text><rect x="950" y="540" width="760" height="145" rx="15" fill="#eaf0ff" stroke="#6f91d4" stroke-width="2"/><text x="970" y="574" font-size="24" text-anchor="start" fill="#23334c" font-weight="600">温度 ≥57 ℃</text><text x="970" y="609.0" font-size="22" text-anchor="start" fill="#23334c" font-weight="400">停止充电。</text><text x="970" y="639.8" font-size="22" text-anchor="start" fill="#23334c" font-weight="400">温度降到“55 ℃ 以下”时恢复。</text><path d="M1330,685 L1330,735" fill="none" stroke="#7c8798" stroke-width="2.5" stroke-linejoin="round"  marker-end="url(#arrow)"/><rect x="1353.0" y="697" width="174" height="27" fill="#fffdee"/><text x="1440" y="718" font-size="20" text-anchor="middle" fill="#7c8798" font-weight="400">达到更高温度阈值</text><rect x="950" y="735" width="760" height="100" rx="15" fill="#eaf0ff" stroke="#6f91d4" stroke-width="2"/><text x="1330.0" y="793.0" font-size="25" text-anchor="middle" fill="#23334c" font-weight="600">温度 ≥60 ℃ → 静默关机</text><rect x="950" y="875" width="760" height="140" rx="15" fill="#fff5f2" stroke="#d99b8c" stroke-width="2"/><text x="970" y="909" font-size="22" text-anchor="start" fill="#ad3636" font-weight="600">原文未展开的边界</text><text x="970" y="944.0" font-size="20" text-anchor="start" fill="#ad3636" font-weight="400">4.0 V、55 ℃ 的“以下”是否含等号未定义。</text><text x="970" y="972.0" font-size="20" text-anchor="start" fill="#ad3636" font-weight="400">46 ℃ 降低后的目标满充电压、各保护叠加时的恢复</text><text x="970" y="1000.0" font-size="20" text-anchor="start" fill="#ad3636" font-weight="400">优先级及回差组合未定义；不得据此补成完整充电控制程序。</text><rect x="40" y="1080" width="1720" height="75" rx="12" fill="#fffef7" stroke="#d5cdb3"/><text x="58" y="1111" font-size="22" text-anchor="start" fill="#23334c" font-weight="600">状态关系</text><text x="160" y="1111.0" font-size="20" text-anchor="start" fill="#23334c" font-weight="400">设备功能说明 §5.1 写拔出后恢复互动，§6.2 同时要求充电 / 行为静默 / 睡眠时段全部解除才退出深待机；图中保留这一完整退出条件。</text><text x="44" y="1173" font-size="16.5" text-anchor="start" fill="#5d6979" font-weight="400">依据：设备功能说明 §§2.1、5、6.2；动作统计表「状态表」第4行。</text></g></svg>