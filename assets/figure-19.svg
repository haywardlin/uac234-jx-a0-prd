<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1350" viewBox="0 0 1800 1350" role="img" aria-label="设备状态机：开关机、浅睡与深度待机"><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9" fill="none" stroke="#7c8798" stroke-width="1.3"/></marker></defs><g font-family="PingFang SC,Microsoft YaHei,Noto Sans CJK SC,sans-serif"><rect width="1800" height="1350" fill="#fffdee"/><text x="900.0" y="56" font-size="34" text-anchor="middle" fill="#23334c" font-weight="600">设备状态机：开关机、浅睡与深度待机</text><text x="900.0" y="94" font-size="18" text-anchor="middle" fill="#5d6979" font-weight="400">主图按《设备功能说明》绘制；资源表的差异在红色说明中保留。</text><line x1="42" y1="116" x2="1758" y2="116" stroke="#dad8c6"/><rect x="40" y="140" width="1720" height="270" rx="18" fill="#ffffff" fill-opacity=".52" stroke="#ddd9c5"/><text x="60" y="174" font-size="24" text-anchor="start" fill="#23334c" font-weight="600">开关机</text><ellipse cx="190.0" cy="260.0" rx="115.0" ry="45.0" fill="#eef0f3" stroke="#a4abb5" stroke-width="2"/><text x="190.0" y="268.0" font-size="24" text-anchor="middle" fill="#23334c" font-weight="600">关机</text><path d="M580.0,200 L730,260.0 L580.0,320 L430,260.0 Z" fill="#fff0d7" stroke="#e3a14e" stroke-width="2"/><text x="580.0" y="251.60000000000002" font-size="21" text-anchor="middle" fill="#23334c" font-weight="600">按住满 3 秒</text><text x="580.0" y="281.0" font-size="21" text-anchor="middle" fill="#23334c" font-weight="600">电压 &gt; 3.45 V？</text><rect x="960" y="200" width="740" height="135" rx="15" fill="#eaf0ff" stroke="#6f91d4" stroke-width="2"/><text x="980" y="234" font-size="24" text-anchor="start" fill="#23334c" font-weight="600">开机过程</text><text x="980" y="269.0" font-size="22" text-anchor="start" fill="#23334c" font-weight="400">马达震动约 0.3 秒；约 3 秒后传感器就绪。</text><text x="980" y="299.8" font-size="22" text-anchor="start" fill="#23334c" font-weight="400">随后播放开机动作和伴音；蓝牙可被发现。</text><path d="M305,260 L430,260" fill="none" stroke="#7c8798" stroke-width="2.5" stroke-linejoin="round"  marker-end="url(#arrow)"/><rect x="318.0" y="224" width="94" height="27" fill="#fffdee"/><text x="365" y="245" font-size="20" text-anchor="middle" fill="#7c8798" font-weight="400">用户开机</text><path d="M730,260 L960,260" fill="none" stroke="#7c8798" stroke-width="2.5" stroke-linejoin="round"  marker-end="url(#arrow)"/><rect x="818.0" y="224" width="34" height="27" fill="#fffdee"/><text x="835" y="245" font-size="20" text-anchor="middle" fill="#7c8798" font-weight="400">是</text><path d="M580,320 L580,371 L190,371 L190,305" fill="none" stroke="#7c8798" stroke-width="2.5" stroke-linejoin="round"  marker-end="url(#arrow)"/><rect x="303.0" y="341" width="214" height="27" fill="#fffdee"/><text x="410" y="362" font-size="20" text-anchor="middle" fill="#7c8798" font-weight="400">否：拒绝开机，无反馈</text><text x="1000" y="373" font-size="21" text-anchor="start" fill="#23334c" font-weight="400">首次接电池 / 复位：电压正常时自动开机。</text><rect x="40" y="440" width="1720" height="620" rx="18" fill="#ffffff" fill-opacity=".52" stroke="#ddd9c5"/><text x="60" y="474" font-size="24" text-anchor="start" fill="#23334c" font-weight="600">开机后的省电状态</text><rect x="670" y="505" width="460" height="120" rx="15" fill="#eaf0ff" stroke="#6f91d4" stroke-width="2"/><text x="690" y="539" font-size="24" text-anchor="start" fill="#23334c" font-weight="600">正常状态</text><text x="690" y="574.0" font-size="22" text-anchor="start" fill="#23334c" font-weight="400">按事件规则进行互动；蓝牙可连接。</text><path d="M1330,335 L1330,470 L900,470 L900,505" fill="none" stroke="#7c8798" stroke-width="2.5" stroke-linejoin="round"  marker-end="url(#arrow)"/><rect x="100" y="735" width="460" height="160" rx="15" fill="#eaf0ff" stroke="#6f91d4" stroke-width="2"/><text x="120" y="769" font-size="24" text-anchor="start" fill="#23334c" font-weight="600">浅睡</text><text x="120" y="804.0" font-size="22" text-anchor="start" fill="#23334c" font-weight="400">动作模块、马达、扬声器断电。</text><text x="120" y="834.8" font-size="22" text-anchor="start" fill="#23334c" font-weight="400">触摸、IMU、光感继续检测。</text><text x="120" y="865.6" font-size="22" text-anchor="start" fill="#23334c" font-weight="400">唤醒词可完全唤醒。</text><rect x="670" y="825" width="460" height="150" rx="15" fill="#eaf0ff" stroke="#6f91d4" stroke-width="2"/><text x="690" y="859" font-size="24" text-anchor="start" fill="#23334c" font-weight="600">短暂唤醒</text><text x="690" y="894.0" font-size="22" text-anchor="start" fill="#23334c" font-weight="400">上电约 6 秒，做一个动作。</text><text x="690" y="924.8" font-size="22" text-anchor="start" fill="#23334c" font-weight="400">不算作互动；完成后回浅睡。</text><rect x="1270" y="735" width="440" height="160" rx="15" fill="#eaf0ff" stroke="#6f91d4" stroke-width="2"/><text x="1290" y="769" font-size="23" text-anchor="start" fill="#23334c" font-weight="600">待机（深度省电）</text><text x="1290" y="804.0" font-size="21" text-anchor="start" fill="#23334c" font-weight="400">音频、语音识别、触摸、动作断电。</text><text x="1290" y="833.4" font-size="21" text-anchor="start" fill="#23334c" font-weight="400">所有互动 / 唤醒均不响应。</text><text x="1290" y="862.8" font-size="21" text-anchor="start" fill="#23334c" font-weight="400">蓝牙仍可连接、查询、设置。</text><path d="M670,550 L330,550 L330,735" fill="none" stroke="#7c8798" stroke-width="2.5" stroke-linejoin="round"  marker-end="url(#arrow)"/><rect x="300.0" y="515" width="250.0" height="27" fill="#fffdee"/><text x="425" y="536" font-size="20" text-anchor="middle" fill="#7c8798" font-weight="400">1 分钟无触摸 / 姿态事件</text><path d="M560,775 L610,775 L610,605 L670,605" fill="none" stroke="#7c8798" stroke-width="2.5" stroke-linejoin="round"  marker-end="url(#arrow)"/><rect x="553.0" y="669" width="114" height="27" fill="#fffdee"/><text x="610" y="690" font-size="20" text-anchor="middle" fill="#7c8798" font-weight="400">完全唤醒①</text><path d="M560,855 L620,855 L620,860 L670,860" fill="none" stroke="#7c8798" stroke-width="2.5" stroke-linejoin="round"  marker-end="url(#arrow)"/><rect x="558.0" y="801" width="114" height="27" fill="#fffdee"/><text x="615" y="822" font-size="20" text-anchor="middle" fill="#7c8798" font-weight="400">短暂唤醒②</text><path d="M790,975 L790,1015 L250,1015 L250,895" fill="none" stroke="#7c8798" stroke-width="2.5" stroke-linejoin="round"  marker-end="url(#arrow)"/><rect x="453.0" y="983" width="94" height="27" fill="#fffdee"/><text x="500" y="1004" font-size="20" text-anchor="middle" fill="#7c8798" font-weight="400">动作结束</text><path d="M1130,550 L1500,550 L1500,735" fill="none" stroke="#7c8798" stroke-width="2.5" stroke-linejoin="round"  marker-end="url(#arrow)"/><rect x="1298.0" y="515" width="214" height="27" fill="#fffdee"/><text x="1405" y="536" font-size="20" text-anchor="middle" fill="#7c8798" font-weight="400">任一深待机条件成立③</text><path d="M1270,855 L1190,855 L1190,605 L1130,605" fill="none" stroke="#7c8798" stroke-width="2.5" stroke-linejoin="round"  marker-end="url(#arrow)"/><rect x="1113.0" y="669" width="154" height="27" fill="#fffdee"/><text x="1190" y="690" font-size="20" text-anchor="middle" fill="#7c8798" font-weight="400">全部条件解除④</text><rect x="65" y="1085" width="525" height="160" rx="15" fill="#fffef7" stroke="#d5cdb3" stroke-width="2"/><text x="85" y="1119" font-size="21" text-anchor="start" fill="#23334c" font-weight="600">① 完全唤醒</text><text x="85" y="1154.0" font-size="19" text-anchor="start" fill="#23334c" font-weight="400">触摸（补播此次反应）、拿起 / 晃动、</text><text x="85" y="1180.6" font-size="19" text-anchor="start" fill="#23334c" font-weight="400">Hello Beany、遇到其他 Beany。</text><text x="85" y="1207.2" font-size="19" text-anchor="start" fill="#23334c" font-weight="400">确认放下期间不进浅睡；光感不重置 1 分钟。</text><rect x="610" y="1085" width="565" height="160" rx="15" fill="#fff5f2" stroke="#d99b8c" stroke-width="2"/><text x="630" y="1119" font-size="21" text-anchor="start" fill="#ad3636" font-weight="600">② 短暂唤醒</text><text x="630" y="1154.0" font-size="19" text-anchor="start" fill="#ad3636" font-weight="400">变暗 / 变亮、呼吸、2 小时 / 48 小时无互动、低电。</text><text x="630" y="1180.6" font-size="19" text-anchor="start" fill="#ad3636" font-weight="400">呼吸：设备文档为 10 分钟首次 / 每 10 分钟；</text><text x="630" y="1207.2" font-size="19" text-anchor="start" fill="#ad3636" font-weight="400">动作表写 5 分钟～2 小时每 30 秒，另有“不要”。</text><rect x="1195" y="1085" width="540" height="160" rx="15" fill="#fffef7" stroke="#d5cdb3" stroke-width="2"/><text x="1215" y="1119" font-size="21" text-anchor="start" fill="#23334c" font-weight="600">③ / ④ 深待机条件</text><text x="1215" y="1154.0" font-size="19" text-anchor="start" fill="#23334c" font-weight="400">充电插入 5 秒后、行为静默、处于睡眠时段。</text><text x="1215" y="1180.6" font-size="19" text-anchor="start" fill="#23334c" font-weight="400">三项全部解除才恢复，恢复后约 8 秒抑制光感事件。</text><text x="1215" y="1207.2" font-size="19" text-anchor="start" fill="#23334c" font-weight="400">若插入前已静音 / 睡眠，直接待机；“静音”需核对。</text><text x="75" y="405" font-size="19" text-anchor="start" fill="#5d6979" font-weight="400">关机状态插充电：只充电，拔出仍关机。</text><text x="65" y="1048" font-size="21" text-anchor="start" fill="#23334c" font-weight="400">全局条件：正常、浅睡、短暂唤醒都适用③；任一深待机条件成立，即转入深待机。</text><text x="65" y="1274" font-size="19" text-anchor="start" fill="#23334c" font-weight="400">任一开机状态：按键 4 秒 → 震动约 1 秒 + 关机动作约 3 秒 → 保存数据 → 关机；低压 / 过温 → 静默关机。</text><text x="44" y="1293" font-size="16.5" text-anchor="start" fill="#5d6979" font-weight="400">依据：设备功能说明 §§2、5、6、8；动作统计表「输入事件」第40行、「状态表」第5行；初始成长表第115行。</text></g></svg>