<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1260" viewBox="0 0 1800 1260" role="img" aria-label="交友流程与实体按键功能"><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9" fill="none" stroke="#7c8798" stroke-width="1.3"/></marker></defs><g font-family="PingFang SC,Microsoft YaHei,Noto Sans CJK SC,sans-serif"><rect width="1800" height="1260" fill="#fffdee"/><text x="900.0" y="56" font-size="34" text-anchor="middle" fill="#23334c" font-weight="600">交友流程与实体按键功能</text><text x="900.0" y="94" font-size="18" text-anchor="middle" fill="#5d6979" font-weight="400">交友发现通过设备蓝牙完成；相遇与离开采用不同时间条件。</text><line x1="42" y1="116" x2="1758" y2="116" stroke="#dad8c6"/><rect x="40" y="140" width="980" height="1000" rx="18" fill="#ffffff" fill-opacity=".52" stroke="#ddd9c5"/><text x="60" y="174" font-size="24" text-anchor="start" fill="#23334c" font-weight="600">附近 Beany 的相遇与离开</text><rect x="90" y="200" width="880" height="105" rx="15" fill="#eaf0ff" stroke="#6f91d4" stroke-width="2"/><text x="530.0" y="260.5" font-size="25" text-anchor="middle" fill="#23334c" font-weight="600">前提：已绑定 App，且交友开关打开</text><path d="M530,305 L530,350" fill="none" stroke="#7c8798" stroke-width="2.5" stroke-linejoin="round"  marker-end="url(#arrow)"/><path d="M530.0,350 L740,417.5 L530.0,485 L320,417.5 Z" fill="#fff0d7" stroke="#e3a14e" stroke-width="2"/><text x="530.0" y="409.1" font-size="21" text-anchor="middle" fill="#23334c" font-weight="600">约 5 米内</text><text x="530.0" y="438.5" font-size="21" text-anchor="middle" fill="#23334c" font-weight="600">持续 30 秒？</text><rect x="90" y="540" width="400" height="140" rx="15" fill="#eaf0ff" stroke="#6f91d4" stroke-width="2"/><text x="110" y="574" font-size="23" text-anchor="start" fill="#23334c" font-weight="600">首次见到：新朋友事件</text><text x="110" y="609.0" font-size="21" text-anchor="start" fill="#23334c" font-weight="400">触发对应候选动作 / 伴音。</text><text x="110" y="638.4" font-size="21" text-anchor="start" fill="#23334c" font-weight="400">更新好友记录。</text><rect x="570" y="540" width="400" height="140" rx="15" fill="#eaf0ff" stroke="#6f91d4" stroke-width="2"/><text x="590" y="574" font-size="23" text-anchor="start" fill="#23334c" font-weight="600">曾经见过：老朋友事件</text><text x="590" y="609.0" font-size="21" text-anchor="start" fill="#23334c" font-weight="400">触发对应候选动作 / 伴音。</text><text x="590" y="638.4" font-size="21" text-anchor="start" fill="#23334c" font-weight="400">更新最近相遇时间及次数。</text><path d="M430,453 L290,453 L290,540" fill="none" stroke="#7c8798" stroke-width="2.5" stroke-linejoin="round"  marker-end="url(#arrow)"/><rect x="233.0" y="487" width="114" height="27" fill="#fffdee"/><text x="290" y="508" font-size="20" text-anchor="middle" fill="#7c8798" font-weight="400">成立；首次</text><path d="M630,453 L770,453 L770,540" fill="none" stroke="#7c8798" stroke-width="2.5" stroke-linejoin="round"  marker-end="url(#arrow)"/><rect x="703.0" y="487" width="134" height="27" fill="#fffdee"/><text x="770" y="508" font-size="20" text-anchor="middle" fill="#7c8798" font-weight="400">成立；曾相遇</text><path d="M290,680 L290,735 L530,735 L530,775" fill="none" stroke="#7c8798" stroke-width="2.5" stroke-linejoin="round"  marker-end="url(#arrow)"/><path d="M770,680 L770,735 L530,735" fill="none" stroke="#7c8798" stroke-width="2.5" stroke-linejoin="round"  marker-end="url(#arrow)"/><rect x="90" y="775" width="880" height="140" rx="15" fill="#eaf0ff" stroke="#6f91d4" stroke-width="2"/><text x="110" y="809" font-size="24" text-anchor="start" fill="#23334c" font-weight="600">走远约 10 米外，或信号消失</text><text x="110" y="844.0" font-size="22" text-anchor="start" fill="#23334c" font-weight="400">累计 10 分钟后判定离开。</text><text x="110" y="874.8" font-size="22" text-anchor="start" fill="#23334c" font-weight="400">离开不触发动作，只更新 App 好友状态。</text><rect x="90" y="955" width="880" height="145" rx="15" fill="#fffef7" stroke="#d5cdb3" stroke-width="2"/><text x="110" y="989" font-size="22" text-anchor="start" fill="#23334c" font-weight="600">好友列表</text><text x="110" y="1024.0" font-size="20" text-anchor="start" fill="#23334c" font-weight="400">最多 20 个好友；相遇次数上限 255。第 21 个好友加入时，</text><text x="110" y="1052.0" font-size="20" text-anchor="start" fill="#23334c" font-weight="400">先淘汰最近相遇时间最早者，再比首次相遇时间，最后比身份字典序。</text><text x="110" y="1080.0" font-size="20" text-anchor="start" fill="#23334c" font-weight="400">读取好友列表不会像读取成功的事件记录那样清空好友数据。</text><rect x="1060" y="140" width="700" height="1000" rx="18" fill="#ffffff" fill-opacity=".52" stroke="#ddd9c5"/><text x="1080" y="174" font-size="24" text-anchor="start" fill="#23334c" font-weight="600">实体按键</text><rect x="1110" y="200" width="600" height="110" rx="15" fill="#eaf0ff" stroke="#6f91d4" stroke-width="2"/><text x="1410.0" y="263.0" font-size="24" text-anchor="middle" fill="#23334c" font-weight="600">多次点击：相邻间隔 &lt;0.4 秒</text><rect x="1110" y="355" width="600" height="155" rx="15" fill="#eaf0ff" stroke="#6f91d4" stroke-width="2"/><text x="1130" y="389" font-size="23" text-anchor="start" fill="#23334c" font-weight="600">单击 / 双击</text><text x="1130" y="424.0" font-size="21" text-anchor="start" fill="#23334c" font-weight="400">单击：仅绑定等待 60 秒内确认，其他时间无作用。</text><text x="1130" y="453.4" font-size="21" text-anchor="start" fill="#23334c" font-weight="400">双击：断开蓝牙、清本次鉴权、重新可发现。</text><rect x="1110" y="555" width="600" height="155" rx="15" fill="#eaf0ff" stroke="#6f91d4" stroke-width="2"/><text x="1130" y="589" font-size="23" text-anchor="start" fill="#23334c" font-weight="600">三击 / 四击 / 五击</text><text x="1130" y="624.0" font-size="21" text-anchor="start" fill="#23334c" font-weight="400">三击：无功能；四击：临时 U 盘模式，按键不能退出。</text><text x="1130" y="653.4" font-size="21" text-anchor="start" fill="#23334c" font-weight="400">五击：产线先启用后进入老化模式 3；再次五击中止并重启</text><text x="1130" y="682.8" font-size="21" text-anchor="start" fill="#23334c" font-weight="400">。</text><rect x="1110" y="755" width="600" height="155" rx="15" fill="#eaf0ff" stroke="#6f91d4" stroke-width="2"/><text x="1130" y="789" font-size="23" text-anchor="start" fill="#23334c" font-weight="600">六击 / 长按</text><text x="1130" y="824.0" font-size="21" text-anchor="start" fill="#23334c" font-weight="400">六击：重启。长按 2 秒：无功能。</text><text x="1130" y="853.4" font-size="21" text-anchor="start" fill="#23334c" font-weight="400">关机态按满 3 秒开机；开机态按满 4 秒关机。</text><rect x="1110" y="955" width="600" height="145" rx="15" fill="#fffef7" stroke="#d5cdb3" stroke-width="2"/><text x="1130" y="989" font-size="22" text-anchor="start" fill="#23334c" font-weight="600">演示与产测</text><text x="1130" y="1024.0" font-size="20" text-anchor="start" fill="#23334c" font-weight="400">App 发起动作轮播，每 5 秒一个动作。</text><text x="1130" y="1052.0" font-size="20" text-anchor="start" fill="#23334c" font-weight="400">老化模式不进浅睡 / 深待机；产测模式不运行正常业务。</text><text x="1130" y="1080.0" font-size="20" text-anchor="start" fill="#23334c" font-weight="400">这些模式不得与普通使用状态混写。</text><text x="44" y="1203" font-size="16.5" text-anchor="start" fill="#5d6979" font-weight="400">依据：设备功能说明 §§2—3、8.5、9；BLE协议 §§5.11—5.13 与「好友列表」。</text></g></svg>