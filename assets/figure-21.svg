<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1270" viewBox="0 0 1600 1270" role="img" aria-label="蓝牙绑定与 App 设置时序"><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9" fill="none" stroke="#7c8798" stroke-width="1.3"/></marker></defs><g font-family="PingFang SC,Microsoft YaHei,Noto Sans CJK SC,sans-serif"><rect width="1600" height="1270" fill="#fffdee"/><text x="800.0" y="56" font-size="34" text-anchor="middle" fill="#23334c" font-weight="600">蓝牙绑定与 App 设置时序</text><text x="800.0" y="94" font-size="18" text-anchor="middle" fill="#5d6979" font-weight="400">先连接、鉴权；需要绑定时，由用户按键确认，再由 App 下发密钥。</text><line x1="42" y1="116" x2="1558" y2="116" stroke="#dad8c6"/><rect x="85" y="135" width="310" height="64" rx="15" fill="#eaf0ff" stroke="#6f91d4" stroke-width="2"/><text x="240.0" y="175.0" font-size="25" text-anchor="middle" fill="#23334c" font-weight="600">用户</text><line x1="240" y1="205" x2="240" y2="990" stroke="#a0a8b2" stroke-dasharray="7 7" stroke-width="2"/><rect x="625" y="135" width="310" height="64" rx="15" fill="#eaf0ff" stroke="#6f91d4" stroke-width="2"/><text x="780.0" y="175.0" font-size="25" text-anchor="middle" fill="#23334c" font-weight="600">App</text><line x1="780" y1="205" x2="780" y2="990" stroke="#a0a8b2" stroke-dasharray="7 7" stroke-width="2"/><rect x="1175" y="135" width="310" height="64" rx="15" fill="#eaf0ff" stroke="#6f91d4" stroke-width="2"/><text x="1330.0" y="175.0" font-size="25" text-anchor="middle" fill="#23334c" font-weight="600">设备</text><line x1="1330" y1="205" x2="1330" y2="990" stroke="#a0a8b2" stroke-dasharray="7 7" stroke-width="2"/><path d="M780,280 L1330,280" fill="none" stroke="#7c8798" stroke-width="2.5" stroke-linejoin="round"  marker-end="url(#arrow)"/><rect x="860.0" y="245" width="390.0000000000001" height="27" fill="#fffdee"/><text x="1055.0" y="266" font-size="20" text-anchor="middle" fill="#7c8798" font-weight="400">连接设备；按 MAC 使用已保存的密钥鉴权</text><path d="M1330,350 L780,350" fill="none" stroke="#7c8798" stroke-width="2.5" stroke-linejoin="round" stroke-dasharray="7 6" marker-end="url(#arrow)"/><rect x="968.0" y="315" width="174" height="27" fill="#fffdee"/><text x="1055.0" y="336" font-size="20" text-anchor="middle" fill="#7c8798" font-weight="400">返回密钥比对结果</text><rect x="65" y="245" width="390" height="150" rx="15" fill="#fffef7" stroke="#d5cdb3" stroke-width="2"/><text x="85" y="279" font-size="22" text-anchor="start" fill="#23334c" font-weight="600">连接时限</text><text x="85" y="314.0" font-size="20" text-anchor="start" fill="#23334c" font-weight="400">每次连接均需鉴权。</text><text x="85" y="342.0" font-size="20" text-anchor="start" fill="#23334c" font-weight="400">连接后 65 秒仍未鉴权：</text><text x="85" y="370.0" font-size="20" text-anchor="start" fill="#23334c" font-weight="400">设备主动断开，再可被发现。</text><rect x="510" y="395" width="1015" height="75" rx="12" fill="#fffef7" stroke="#d5cdb3"/><text x="528" y="426" font-size="22" text-anchor="start" fill="#23334c" font-weight="600">鉴权通过</text><text x="630" y="426.0" font-size="20" text-anchor="start" fill="#23334c" font-weight="400">可进行设置、查询、事件同步及升级；下方为需要重新绑定的分支。</text><path d="M780,535 L1330,535" fill="none" stroke="#7c8798" stroke-width="2.5" stroke-linejoin="round"  marker-end="url(#arrow)"/><rect x="965.6" y="500" width="178.8" height="27" fill="#fffdee"/><text x="1055.0" y="521" font-size="20" text-anchor="middle" fill="#7c8798" font-weight="400">发起绑定（0x02）</text><path d="M780,610 L240,610" fill="none" stroke="#7c8798" stroke-width="2.5" stroke-linejoin="round"  marker-end="url(#arrow)"/><rect x="403.0" y="575" width="214" height="27" fill="#fffdee"/><text x="510.0" y="596" font-size="20" text-anchor="middle" fill="#7c8798" font-weight="400">提示用户单击实体按键</text><path d="M240,690 L1330,690" fill="none" stroke="#7c8798" stroke-width="2.5" stroke-linejoin="round"  marker-end="url(#arrow)"/><rect x="665.6" y="655" width="238.8" height="27" fill="#fffdee"/><text x="785.0" y="676" font-size="20" text-anchor="middle" fill="#7c8798" font-weight="400">在 60 秒内单击按键确认</text><path d="M1330,765 L780,765" fill="none" stroke="#7c8798" stroke-width="2.5" stroke-linejoin="round" stroke-dasharray="7 6" marker-end="url(#arrow)"/><rect x="918.0" y="730" width="274" height="27" fill="#fffdee"/><text x="1055.0" y="751" font-size="20" text-anchor="middle" fill="#7c8798" font-weight="400">返回已确认；超时则返回失败</text><path d="M780,840 L1330,840" fill="none" stroke="#7c8798" stroke-width="2.5" stroke-linejoin="round"  marker-end="url(#arrow)"/><rect x="838.8" y="805" width="432.4" height="27" fill="#fffdee"/><text x="1055.0" y="826" font-size="20" text-anchor="middle" fill="#7c8798" font-weight="400">仅确认成功后，下发 6 字节绑定密钥（0x03）</text><path d="M1330,915 L780,915" fill="none" stroke="#7c8798" stroke-width="2.5" stroke-linejoin="round" stroke-dasharray="7 6" marker-end="url(#arrow)"/><rect x="938.0" y="880" width="234" height="27" fill="#fffdee"/><text x="1055.0" y="901" font-size="20" text-anchor="middle" fill="#7c8798" font-weight="400">保存密钥并返回处理结果</text><rect x="60" y="1015" width="470" height="185" rx="15" fill="#fffef7" stroke="#d5cdb3" stroke-width="2"/><text x="80" y="1049" font-size="21" text-anchor="start" fill="#23334c" font-weight="600">App 可设置</text><text x="80" y="1084.0" font-size="19" text-anchor="start" fill="#23334c" font-weight="400">时间 / 时区、名称（≤25 字节）、音量 1～6 档</text><text x="80" y="1110.6" font-size="19" text-anchor="start" fill="#23334c" font-weight="400">、</text><text x="80" y="1137.2" font-size="19" text-anchor="start" fill="#23334c" font-weight="400">交友开关、五行、演示、行为静默、睡眠时段、</text><text x="80" y="1163.8" font-size="19" text-anchor="start" fill="#23334c" font-weight="400">恢复出厂。</text><rect x="555" y="1015" width="475" height="185" rx="15" fill="#fffef7" stroke="#d5cdb3" stroke-width="2"/><text x="575" y="1049" font-size="21" text-anchor="start" fill="#23334c" font-weight="600">App 可查询 / 接收上报</text><text x="575" y="1084.0" font-size="19" text-anchor="start" fill="#23334c" font-weight="400">电量每 60 秒上报；充电变化立即上报；</text><text x="575" y="1110.6" font-size="19" text-anchor="start" fill="#23334c" font-weight="400">附近好友状态、温度及 WAV 版本等。</text><text x="575" y="1137.2" font-size="19" text-anchor="start" fill="#23334c" font-weight="400">蓝牙深待机下仍可连接、查询和设置。</text><rect x="1055" y="1015" width="485" height="185" rx="15" fill="#fffef7" stroke="#d5cdb3" stroke-width="2"/><text x="1075" y="1049" font-size="21" text-anchor="start" fill="#23334c" font-weight="600">断开 / 重连 / 解绑</text><text x="1075" y="1084.0" font-size="19" text-anchor="start" fill="#23334c" font-weight="400">双击按键：断开、清本次鉴权、重新可发现。</text><text x="1075" y="1110.6" font-size="19" text-anchor="start" fill="#23334c" font-weight="400">解绑：清除密钥，后续需重新绑定。</text><text x="1075" y="1137.2" font-size="19" text-anchor="start" fill="#23334c" font-weight="400">本图不增加账户、云端或二维码流程。</text><text x="44" y="1213" font-size="16.5" text-anchor="start" fill="#5d6979" font-weight="400">依据：设备功能说明 §§3、4、6.2；BLE协议 §§5.1—5.7、6、8。</text></g></svg>